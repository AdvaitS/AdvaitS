name: generate arcade contribution graphs

on:
    schedule: # Run automatically every 24 hours
        - cron: '0 0 * * *'
    workflow_dispatch: # Allows manual triggering
    push: # Runs on every push to the main branch
        branches:
            - main

jobs:
    generate:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: generate randomized galaga SVGs
              run: |
                  mkdir -p dist
                  npx --yes pacman-contribution-graph \
                      --platform scenario \
                      --username ${{ github.repository_owner }} \
                      --game galaga \
                      --gameTheme github \
                      --scenario random \
                      --output dist/galaga-contribution-graph.svg
                  npx --yes pacman-contribution-graph \
                      --platform scenario \
                      --username ${{ github.repository_owner }} \
                      --game galaga \
                      --gameTheme github-dark \
                      --scenario random \
                      --output dist/galaga-contribution-graph-dark.svg

            # Push the generated SVGs to the output branch
            - name: push SVGs to the output branch
              uses: crazy-max/ghaction-github-pages@v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
